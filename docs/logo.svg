  <rect x="62" y="62" width="176" height="176" rx="46" stroke="#7C9CF8" stroke-width="11"/>
  <g transform="translate(75 76) scale(6)" stroke="#EDEFF5" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
