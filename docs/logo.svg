<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none" role="img" aria-label="An open book inside a highlight ring">
  <!--
    The plugin in one mark: the open book editors click for help, inside the
    soft ring a guide draws around whatever it is pointing at. The book glyph is
    the one from @sanity/icons that the navbar button uses, so the logo and the
    product cannot drift apart.

    Transparent background — the Sanity Exchange paints its own behind this.
  -->
